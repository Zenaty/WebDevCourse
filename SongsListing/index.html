<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TubeTracker</title>
    <link
      rel="stylesheet"
      href="https://bootswatch.com/5/cyborg/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body class="p-4">
    <div class="container">
      <h1 class="text-center text-primary mb-4">
        🎵 Excercise Songs List - Or Zenaty
      </h1>

      <div class="card border-primary mb-4">
        <div class="card-body">
          <form id="songForm" class="row g-2">
            <input type="hidden" id="songId" />

            <div class="col-md-5">
              <input
                type="text"
                id="title"
                class="form-control"
                placeholder="Song Title"
                required
              />
            </div>
            <div class="col-md-5">
              <input
                type="url"
                id="url"
                class="form-control"
                placeholder="YouTube URL"
                required
              />
            </div>
            <div class="col-md-2">
              <input
                id="rating"
                type="number"
                class="form-control"
                placeholder="Rate 1-10"
                min="1"
                max="10"
              />
            </div>
            <div class="col-md-2">
              <button
                type="submit"
                id="submitBtn"
                class="btn btn-success w-100"
              >
                <i class="fas fa-plus"></i> Add
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="d-flex justify-content-between mb-3">
        <input
          type="text"
          id="search"
          class="form-control w-50"
          placeholder="Search..."
        />
        <div class="d-flex gap-3 mb-3">
          <label>
            <input type="radio" name="sortBy" value="date" checked /> Date Added
          </label>

          <label>
            <input type="radio" name="sortBy" value="title" /> Title (A-Z)
          </label>

          <label>
            <input type="radio" name="sortBy" value="rating" /> Rating
          </label>
        </div>
      </div>

      <div class="d-flex justify-content-end mb-3">
        <button id="toggleViewBtn" class="btn btn-outline-info">
          Toggle View
        </button>
      </div>

      <table class="table table-hover">
        <thead>
          <tr>
            <th>Title(By User)</th>
            <th>Title(By Youtube)</th>
            <th>Thumb</th>
            <th>Link</th>
            <th>Rating</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="songList"></tbody>
      </table>

      <!-- YOUTUBE PLAYER MODAL -->
      <div class="modal fade" id="playerModal">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <iframe
              id="playerFrame"
              width="100%"
              height="450"
              frameborder="0"
              allowfullscreen
            ></iframe>
          </div>
        </div>
      </div>

      <!-- CARDS VIEW -->
      <div id="cardsView" class="row d-none"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
